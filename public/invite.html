<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="0;url=https://discord.com/oauth2/authorize?client_id=1556620719494930562&permissions=380096&integration_type=0&scope=bot"
    http-equiv="refresh">
  <title>招待 | うゆゆBot</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <style>
    :root {
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    img {
      max-width: 100%
    }

    [hidden] {
      display: none !important
    }

    /* 構成: 上部固定ナビ + 幅46remの1カラム。主役はワードマークとコマンド一覧 */
    :root {
      --bg: #F3F8F5;
      --surface: #FFFFFF;
      --fg: #14231C;
      --muted: #56695F;
      --line: #D3E2DA;
      --accent: #0E7A5C;
      --on-accent: #FFFFFF;
      --mark: #FFE58A;
      --chip: #E4F0EA;
      --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1713;
        --surface: #15221C;
        --fg: #E7F2EC;
        --muted: #93AA9F;
        --line: #243A30;
        --accent: #52D3A8;
        --on-accent: #08241A;
        --mark: #5E4E14;
        --chip: #1B2D25;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0E1713;
      --surface: #15221C;
      --fg: #E7F2EC;
      --muted: #93AA9F;
      --line: #243A30;
      --accent: #52D3A8;
      --on-accent: #08241A;
      --mark: #5E4E14;
      --chip: #1B2D25;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 400 1rem/1.8 var(--font-body)
    }

    a {
      color: var(--accent);
      text-underline-offset: .2em
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px
    }

    .top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .top-in {
      max-width: 56rem;
      margin-inline: auto;
      padding: .6rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .3rem 1.2rem
    }

    .brand {
      font: 900 1.3rem/1 var(--font-display);
      color: var(--fg);
      text-decoration: none;
      margin-right: auto;
      padding-block: .35rem;

      /* ▼ 画像とテキストを横並び＆中央揃えにする設定を追加 ▼ */
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      /* 画像と文字の間のすき間 */
    }

    .brand-logo {
      width: 1.8rem;
      /* アイコンの幅（文字サイズに合わせて適宜調整してください） */
      height: 1.8rem;
      /* アイコンの高さ */
      object-fit: contain;
      display: block;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .15rem .25rem
    }

    .nav a {
      padding: .35rem .65rem;
      color: var(--muted);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
      border-radius: .5rem
    }

    .nav a:hover {
      color: var(--fg);
      background: var(--chip)
    }

    .nav a[aria-current="page"] {
      color: var(--fg);
      border-radius: 0;
      box-shadow: inset 0 -3px 0 var(--accent)
    }

    .nav a.join {
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700
    }

    .nav a.join:hover {
      background: var(--accent);
      color: var(--on-accent);
      filter: brightness(1.08)
    }

    .nav a.join[aria-current="page"] {
      box-shadow: none;
      border-radius: .5rem
    }

    .wrap {
      max-width: 46rem;
      margin-inline: auto;
      padding-inline: 1rem;
      padding-block: 3rem 4.5rem;
      display: flex;
      flex-direction: column;
      gap: 3.5rem
    }

    .wrap>section {
      min-width: 0
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      text-wrap: balance;
      margin: 0
    }

    h2 {
      font-size: 1.5rem;
      line-height: 1.4;
      font-weight: 700
    }

    .sec-lead {
      margin: .4rem 0 0;
      color: var(--muted)
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 1.1rem
    }

    .eyebrow {
      margin: 0;
      font: 500 .8rem/1 var(--font-mono);
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase
    }

    .hero h1 {
      font-weight: 900;
      font-size: clamp(2.8rem, 11vw, 5rem);
      line-height: 1.1;
      letter-spacing: .01em
    }

    .hl {
      background: linear-gradient(transparent 62%, var(--mark) 62%);
      padding-inline: .05em
    }

    .lead {
      margin: 0;
      font-size: 1.1rem;
      max-width: 34rem
    }

    .cta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .8rem 1.2rem;
      margin-top: .4rem
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: var(--on-accent);
      padding: .8rem 1.5rem;
      border-radius: .6rem;
      font-weight: 700;
      text-decoration: none;
      font-family: var(--font-body)
    }

    .btn:hover {
      filter: brightness(1.08)
    }

    .btn:focus-visible {
      outline: 3px solid var(--fg);
      outline-offset: 3px
    }

    .chip {
      font: 500 .88rem/1.4 var(--font-mono);
      background: var(--chip);
      border: 1px solid var(--line);
      color: var(--fg);
      padding: .15rem .55rem;
      border-radius: .4rem;
      overflow-wrap: anywhere
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: .9rem 0 0;
      padding: 0;
      list-style: none
    }

    .feat {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 2rem 2.5rem;
      margin-top: 1.4rem
    }

    @media(min-width:44rem) {
      .feat {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    .feat h3 {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.5
    }

    .feat p {
      margin: .4rem 0 0
    }

    .feat .note {
      color: var(--muted);
      font-size: .9rem
    }

    .grp {
      margin: 2rem 0 .5rem;
      font: 700 .8rem/1.4 var(--font-body);
      letter-spacing: .1em;
      color: var(--muted)
    }

    .cmds {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line)
    }

    .cmd {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: .1rem 1.5rem;
      padding: .9rem 0;
      border-bottom: 1px solid var(--line)
    }

    @media(min-width:42rem) {
      .cmd {
        grid-template-columns: 15.5rem minmax(0, 1fr)
      }
    }

    .cmd code {
      font: 500 .9rem/1.7 var(--font-mono);
      color: var(--accent);
      overflow-wrap: anywhere
    }

    .args {
      display: block;
      color: var(--muted);
      font: 400 .78rem/1.6 var(--font-mono)
    }

    .cmd p {
      margin: 0;
      min-width: 0
    }

    .perm-note {
      margin: .9rem 0 0;
      color: var(--muted);
      font-size: .9rem
    }

    .page-title {
      font-weight: 900;
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      line-height: 1.3
    }

    .meta {
      margin: .5rem 0 0;
      color: var(--muted);
      font-size: .9rem
    }

    .doc h2 {
      font-size: 1.15rem;
      line-height: 1.5;
      margin: 2.4rem 0 .4rem
    }

    .doc p,
    .doc li {
      max-width: 40rem
    }

    .doc p {
      margin: .4rem 0
    }

    .doc ul,
    .doc ol {
      margin: .4rem 0;
      padding-left: 1.4rem
    }

    .doc li+li {
      margin-top: .25rem
    }

    .doc>:first-child {
      margin-top: 0
    }

    .tbl {
      overflow-x: auto;
      margin-top: .8rem;
      border-top: 1px solid var(--line)
    }

    .tbl table {
      border-collapse: collapse;
      width: 100%;
      min-width: 36rem;
      font-size: .92rem;
      line-height: 1.65
    }

    .tbl th,
    .tbl td {
      text-align: left;
      vertical-align: top;
      padding: .7rem .9rem .7rem 0;
      border-bottom: 1px solid var(--line)
    }

    .tbl th {
      font-weight: 700;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .06em
    }

    .tbl td:first-child {
      font-weight: 500;
      min-width: 11rem
    }

    .callout {
      margin: 1.2rem 0;
      padding: .9rem 1rem;
      border-left: 4px solid var(--accent);
      background: var(--surface);
      border-radius: 0 .5rem .5rem 0;
      max-width: 40rem
    }

    .callout p {
      margin: 0
    }

    .steps {
      counter-reset: s;
      list-style: none;
      padding: 0 !important;
      margin: 1rem 0 0 !important
    }

    .steps li {
      counter-increment: s;
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr);
      gap: .5rem;
      padding: .55rem 0
    }

    .steps li::before {
      content: counter(s);
      font: 500 .85rem/1.9 var(--font-mono);
      color: var(--accent)
    }

    .foot {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.7
    }

    .foot-in {
      max-width: 56rem;
      margin-inline: auto;
      padding: 1.6rem 1rem 2.2rem;
      display: flex;
      flex-direction: column;
      gap: .6rem
    }

    .foot-in nav {
      display: flex;
      flex-wrap: wrap;
      gap: .2rem 1.2rem
    }

    .foot-in p {
      margin: 0
    }

    @media(prefers-reduced-motion:no-preference) {

      .btn,
      .nav a {
        transition: filter .15s, background .15s, color .15s
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="index.html">
        <img src="uyuyu.png" alt="" class="brand-logo">
        うゆゆBot
      </a>
      <nav class="nav" aria-label="メインメニュー">
        <a href="index.html">機能</a>
        <a href="terms.html">利用規約</a>
        <a href="privacy.html">プライバシー</a>
        <a href="credits.html">クレジット</a>
        <a href="invite.html" class="join" aria-current="page">招待</a>
      </nav>
    </div>
  </header>
  <main class="wrap">

    <section class="doc">
      <h1 class="page-title">リダイレクト中...</h1>
      <p class="meta">ページはすぐ招待リンクへリダイレクトされます...
      </p>
</body>

</html>
